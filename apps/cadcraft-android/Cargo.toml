[package]
name = "cadcraft-android"
description = "CADCraft on Android phones and tablets (eframe NativeActivity, wgpu)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# `android_main` must be `#[unsafe(no_mangle)]` and the JNI calls take raw pointers from the
# activity, so this crate can't use the workspace's `unsafe_code = "forbid"`. Every unsafe block
# is in `android_main` (lib.rs) and `jni_bridge.rs`, each with its own `#[allow]` and a comment.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[lib]
# cdylib: the library the APK loads; lib: unit tests and `cargo check` on the desktop.
crate-type = ["cdylib", "lib"]

[dependencies]
cadcraft-engine = { workspace = true }
cadcraft-ui-egui = { workspace = true }
cadcraft-io = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "persistence", "android-native-activity"] }
# Only to name `AndroidApp`; eframe's feature above picks winit's NativeActivity backend.
winit = { version = "0.30", default-features = false }
android_logger = "0.15"
jni = "0.21"
ndk-context = "0.1"

# Built into an APK with cargo-apk (see .github/workflows/android.yml and docs/android.md).
[package.metadata.android]
package = "io.github.quriris.cadcraft"
apk_name = "cadcraft-mobile"
build_targets = ["aarch64-linux-android"]
# Filled in by the build from assets/app-icon (mipmap-*/ic_launcher.png).
resources = "../../target/android-res"
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 26
# 34, not 35: Android 15 forces edge-to-edge drawing on apps targeting 35, and NativeActivity
# has no insets to keep the menus clear of the status bar.
target_sdk_version = 34

[package.metadata.android.application]
label = "CADCraft Mobile"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
# Rotating, folding, or attaching a keyboard must not restart the app (that would drop the drawing).
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|density|uiMode"
launch_mode = "singleTask"
orientation = "unspecified"
resizeable_activity = true

# Opening and saving drawings anywhere in shared storage (Download, Documents, messenger folders).
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false
